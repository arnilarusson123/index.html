<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="1"/>
      <stop offset="40%" stop-color="#cc0000" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#880000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#440000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#ff0000" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>
  </defs>

  <!-- NO background rectangle — transparent -->

  <!-- Main camera body — filled black with light stroke -->
  <rect x="4" y="16" width="40" height="32" rx="5" ry="5" fill="#0a0a0a" stroke="#e0e0e0" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lens line on body -->
  <line x1="12" y1="32" x2="32" y2="32" stroke="#e0e0e0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Viewfinder triangle — filled black with light stroke -->
  <polygon points="48,22 60,14 60,50 48,42" fill="#0a0a0a" stroke="#e0e0e0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- === EVIL EYE RED DOT === -->
  <circle cx="37" cy="22" r="10" fill="url(#eyeGlow)" opacity="0.45"/>
  <circle cx="37" cy="22" r="5" fill="#ff0000" opacity="0.18" filter="url(#glow)"/>
  <circle cx="37" cy="22" r="3.2" fill="#cc0000" opacity="0.45" filter="url(#glow)"/>
  <circle cx="37" cy="22" r="2" fill="#ff1a1a" filter="url(#outerGlow)"/>
  <circle cx="36.5" cy="21.5" r="0.7" fill="#ff6666" opacity="0.9"/>
  <circle cx="36.3" cy="21.3" r="0.35" fill="#ffcccc" opacity="0.7"/>

</svg>
